<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racik POS Resto</title>
<meta name="description" content="Purwarupa UI/UX aplikasi Point of Sale untuk restoran & F&B: kasir, meja, dapur, resep, pembelian, persediaan, dan laporan keuangan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- Penanda ?v= dinaikkan setiap kali berkas berubah agar peramban tidak memakai salinan lama. -->
<link rel="stylesheet" href="assets/style.css?v=5">
<script>
  /* Tema dipasang sebelum halaman digambar supaya tidak ada kedipan. */
  try {
    var rpt = localStorage.getItem('racikpos-theme');
    if (rpt === 'dark' || rpt === 'light') document.documentElement.setAttribute('data-theme', rpt);
  } catch (e) {}
</script>
</head>
<body>
<div id="login" class="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-text">
        <span class="brand-name">Racik POS</span><br>
        <span class="brand-sub">POS · Resto &amp; F&amp;B</span>
      </span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-prefs">
        <div class="theme-switch" role="group" aria-label="Tema" id="theme-switch"></div>
        <button type="button" class="collapse-btn" data-act="collapse" title="Ciutkan menu" aria-label="Ciutkan menu" id="collapse-ic"></button>
      </div>
      <div class="side-user">
        <button type="button" class="side-me" data-act="profile" title="Profil saya">
          <span class="avatar" id="avatar"></span>
          <span class="u-text"><span class="u-name" id="u-name"></span><span class="u-role" id="u-role"></span></span>
        </button>
        <button type="button" class="side-btn" data-act="lock" title="Kunci layar (ganti kasir)" aria-label="Kunci layar" id="lock-btn"></button>
        <button type="button" class="side-btn" data-act="logout" title="Keluar" aria-label="Keluar" id="logout-btn"></button>
      </div>
    </div>
  </aside>
  <div class="scrim" data-act="nav-close"></div>
  <div class="main">
    <header class="hero" id="hero">
      <div class="hero-row">
        <div class="hero-left">
          <button type="button" class="icon-btn menu-toggle" data-act="nav-open" aria-label="Buka menu" id="menu-btn"></button>
          <div>
            <div class="hero-eyebrow" id="crumb"></div>
            <h1 id="page-title">Dasbor</h1>
            <p id="page-desc"></p>
          </div>
        </div>
        <div class="hero-right" id="hero-right"></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>

<script src="assets/icons.js?v=5"></script>
<script src="assets/data.js?v=5"></script>
<script src="assets/ui.js?v=5"></script>
<script src="assets/auth.js?v=5"></script>
<script src="assets/views-ops.js?v=5"></script>
<script src="assets/views-stock.js?v=5"></script>
<script src="assets/views-finance.js?v=5"></script>
<script>boot();</script>
</body>
</html>
